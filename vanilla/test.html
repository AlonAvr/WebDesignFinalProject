<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vanilla DB Test - Costly</title>
    <style>
      body {
        font-family: ui-monospace, Consolas, monospace;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
      }
      pre {
        background: #1e293b;
        padding: 12px 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .pass { color: #4ade80; }
      .fail { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>Vanilla db.js Test Harness</h1>
    <p>Open the browser console to see full output. Results are also rendered below.</p>
    <pre id="output">Running...</pre>

    <script src="./db.js"></script>
    <script>
      // Runs a small assertion helper that logs to both console and page.
      function log(message, ok) {
        const line = document.createElement('div')
        line.className = ok === undefined ? '' : ok ? 'pass' : 'fail'
        line.textContent = (ok === undefined ? '' : ok ? '[PASS] ' : '[FAIL] ') + message
        document.getElementById('output').appendChild(line)
        console.log(message)
      }

      // Clear previous runs so the test is repeatable.
      window.localStorage.clear()

      const ob = window.db.openCostsDB('costsdb', 1)

      const result1 = ob.addCost({
        sum: 200,
        currency: 'USD',
        category: 'FOOD',
        description: 'pizza',
      })

      const result2 = ob.addCost({
        sum: 400,
        currency: 'USD',
        category: 'CAR',
        description: 'fuel',
      })

      document.getElementById('output').textContent = ''

      log('addCost result1: ' + JSON.stringify(result1))
      log('addCost result2: ' + JSON.stringify(result2))

      log(
        'result1 has exactly {sum, currency, category, description}',
        Object.keys(result1).sort().join(',') === 'category,currency,description,sum'
      )

      const data = ob.getReport('USD')
      log('getReport("USD") -> ' + JSON.stringify(data))
      log('data.total.sum === 600', data.total.sum === 600)
      log('data.costs.length === 2', data.costs.length === 2)

      // Explicit year/month report using the current date, should match.
      const now = new Date()
      const explicit = ob.getReport('USD', now.getFullYear(), now.getMonth() + 1)
      log('explicit month/year report total === 600', explicit.total.sum === 600)

      // ILS conversion sanity check (rates: USD 1, ILS 3.4 => 1 USD = 3.4 ILS)
      const ilsReport = ob.getReport('ILS')
      log('getReport("ILS") total -> ' + JSON.stringify(ilsReport.total))
      log('ILS total === 2040 (600 * 3.4)', ilsReport.total.sum === 2040)

      // Mixed currency check: add an ILS cost and verify conversion back to USD.
      ob.addCost({ sum: 340, currency: 'ILS', category: 'FOOD', description: 'coffee' })
      const mixed = ob.getReport('USD')
      // 600 USD + (340 ILS -> 100 USD) = 700 USD
      log('mixed currency total === 700', mixed.total.sum === 700)

      // Validation check: invalid currency should throw.
      let threw = false
      try {
        ob.addCost({ sum: 10, currency: 'XXX', category: 'TEST', description: 'bad' })
      } catch (e) {
        threw = true
        log('invalid currency correctly threw: ' + e.message)
      }
      log('invalid currency throws an Error', threw)
    </script>
  </body>
</html>
